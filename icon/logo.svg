<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Pi-Pi brand mark: two offset pixel "pi" glyphs forming a double echo, on the fork palette. -->
  <!-- Echo glyph (amber): the "second pi", smaller, top-left -->
  <g transform="translate(80,80) scale(0.36)">
    <path fill="#FFB454" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/>
    <path fill="#FFB454" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/>
    <path fill="#FFB454" d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>
  <!-- Main glyph (violet / teal / amber), lower-right -->
  <g transform="translate(300,300) scale(0.64)">
    <path fill="#7C6CF0" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/>
    <path fill="#2FBFA7" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/>
    <path fill="#FFB454" d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>
  <!-- Agent spark bridging the two glyphs -->
  <path fill="#7C6CF0" d="M330 298H392V360H330Z" opacity="0.55"/>
</svg>
