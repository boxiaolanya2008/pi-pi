<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No remote code, no inline script: the renderer only runs what is bundled with the app. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pi</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<header class="bar">
			<div class="bar-left">
				<span class="name">Pi</span>
				<button id="folder" type="button" title="Choose working folder">Choose folder</button>
				<span id="cwd" class="muted"></span>
			</div>
			<div class="bar-right">
				<span id="model" class="muted"></span>
				<span id="thinking" class="pill" hidden></span>
				<button id="abort" type="button" hidden>Stop</button>
			</div>
		</header>

		<main id="transcript" class="transcript" aria-live="polite"></main>

		<footer class="composer">
			<textarea
				id="input"
				rows="1"
				placeholder="Ask Pi to change something. Enter to send, Shift+Enter for a new line."
			></textarea>
			<button id="send" type="button">Send</button>
		</footer>

		<div id="status" class="status" hidden></div>

		<script type="module" src="./renderer.js"></script>
	</body>
</html>
